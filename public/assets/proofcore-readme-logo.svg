<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="proofcore-readme-logo-title">
  <title id="proofcore-readme-logo-title">PC PROOFCORE</title>
  <defs>
    <linearGradient id="proofcoreLogoFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#b7c4d4"/>
    </linearGradient>
    <linearGradient id="proofcoreLogoEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#264563"/>
      <stop offset="1" stop-color="#061426"/>
    </linearGradient>
    <filter id="proofcoreLogoShadow" x="-4%" y="-12%" width="110%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="3.5" flood-color="#001326" flood-opacity="0.72"/>
      <feDropShadow dx="0" dy="15" stdDeviation="1.8" flood-color="#12b7f5" flood-opacity="0.48"/>
    </filter>
  </defs>
  <g filter="url(#proofcoreLogoShadow)" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900">
    <text x="76" y="177" font-size="156" letter-spacing="-12" fill="url(#proofcoreLogoFill)" stroke="url(#proofcoreLogoEdge)" stroke-width="5" paint-order="stroke fill">PC</text>
    <text x="330" y="169" font-size="106" letter-spacing="3" fill="url(#proofcoreLogoFill)" stroke="url(#proofcoreLogoEdge)" stroke-width="4" paint-order="stroke fill">PROOFCORE</text>
  </g>
</svg>
